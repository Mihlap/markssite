# Разработка: docker compose up --build
# (переменные из backend/.env и frontend/.env)
#
# Production: раскомментировать блок в конце файла и выполнить:
#   docker compose --env-file backend/.env --env-file frontend/.env up --build -d

services:
  db:
    container_name: markssite-db-dev
    image: postgres:15.4-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export POSTGRES_USER="$$DB_USER"
        export POSTGRES_PASSWORD="$$DB_PASS"
        export POSTGRES_DB="$$DB_NAME"
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - markssite-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$DB_USER\" -d \"$$DB_NAME\""]
      interval: 10s
      timeout: 5s
      retries: 5

  mainServer:
    image: markssite-backend:dev
    container_name: markssite-backend-dev
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DB_HOST: db
    ports:
      - "3002:3002"
    volumes:
      - ./backend:/backend
      - backend_node_modules:/backend/node_modules
      - ./backend/sessions:/backend/sessions
      - ./backend/images:/backend/images
    depends_on:
      db:
        condition: service_healthy
    networks:
      - markssite-network

  frontend:
    image: markssite-frontend:dev
    container_name: markssite-frontend-dev
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    env_file:
      - ./frontend/.env
    environment:
      DOCKER: "1"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    depends_on:
      - mainServer
    networks:
      - markssite-network

networks:
  markssite-network:
    driver: bridge

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules:

