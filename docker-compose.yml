version: '3'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432" 
    environment:
     - POSTGRES_DB=marks-group
     - POSTGRES_USER=mihlap
     - POSTGRES_PASSWORD=Simon098
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile.frontend
    ports:
      - "3000:3000"

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile.backend
    ports:
      - "3002:3002"

volumes:
  postgres_data:
