version: '3.8'
services:
  mainServer:
    container_name: mainServer
    image: backend-image
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - DATABASE=${DATABASE}
    depends_on:
      - db
  db:
    container_name: db
    image: postgres:15.4-alpine
    environment:
      - POSTGRES_DB=${DBNAME}
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASS}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ${PGPATH}/var/lib/postgresql/data
    ports:
      - "5432:5432"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"

# запуск docker-compose --env-file composeenv up --build